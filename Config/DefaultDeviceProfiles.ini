; ★ 2026-10-03（related/devai_dll/hakodrone_unreal_drone_migration_20260930.md・A3）:
;   このプロジェクトは VR ではなく 2D の Android アプリ（Quest では窓の中の画面）。エンジンの Quest 用の端末設定
;   （Meta_Quest_* → Android_OpenXR）は起動時に VR の描画（マルチビュー）を強制し、クックしていない
;   FHdrCustomResolveArray8xPS を求めて落ちた。VR の 3 つを取り消して 0 にする。
[Android_OpenXR DeviceProfile]
-CVars=vr.MobileMultiView=1
-CVars=r.ForceStartInVR=1
-Cvars=XR.StandAloneStereoOnlyDevice=1
+CVars=vr.MobileMultiView=0
+CVars=r.ForceStartInVR=0
+CVars=XR.StandAloneStereoOnlyDevice=0
